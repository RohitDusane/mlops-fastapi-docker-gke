name: Deploy Diabetes Risk API - k3s AWS EC2

on:
  push:
    branches:
      - ver/new_upgrade

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
  ECR_REPOSITORY: db-risk-app
  K8S_DEPLOYMENT: diabetes-api
  K8S_CONTAINER: diabetes-api

jobs:
################################################
# 1. TEST
################################################
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
          pip install -r requirements-dev.txt


      - name: Ruff
        run: |
          ruff check .


      - name: Pytest
        run: |
          pytest tests/ -v

################################################
# 2. BUILD IMAGE
################################################
  build:
    name: Build Scan Push Image
    needs: test
    if: github.ref == 'refs/heads/ver/new_upgrade'
    runs-on: ubuntu-latest


    outputs:
      image_tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate Image Tag
        id: version
        run: |
          echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT


      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:
            arn:aws:iam::${{vars.ACCOUNT_ID}}:role/github-actions-deploy

          aws-region:
            ${{env.AWS_REGION}}


      - name: Login ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push ARM64 Image
        run: |

          IMAGE=${{steps.ecr.outputs.registry}}/${{env.ECR_REPOSITORY}}:${{steps.version.outputs.tag}}

          echo "Building:"
          echo $IMAGE

          docker buildx build \
            --platform linux/arm64 \
            --push \
            --provenance=false \
            --sbom=false \
            -t $IMAGE \
            .

      - name: Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{steps.ecr.outputs.registry}}/${{env.ECR_REPOSITORY}}:${{steps.version.outputs.tag}}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Verify Image Architecture
        run: |
          docker buildx imagetools inspect \
          ${{steps.ecr.outputs.registry}}/${{env.ECR_REPOSITORY}}:${{steps.version.outputs.tag}}

      # - name: Push Image
      #   run: |
      #     docker push \
      #     ${{steps.ecr.outputs.registry}}/${{env.ECR_REPOSITORY}}:${{steps.version.outputs.tag}}

################################################
# 3. DEPLOY TO k3s
################################################

  deploy:
    name: Deploy k3s
    needs: build
    runs-on: ubuntu-latest
    environment:
      production

    steps:
      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:
            arn:aws:iam::${{vars.ACCOUNT_ID}}:role/github-actions-deploy
          aws-region:
            ${{env.AWS_REGION}}

      - name: Deploy using SSM with validation
        shell: bash
        run: |
          IMAGE_TAG=${{needs.build.outputs.image_tag}}
          echo "Deploying VERSION: $IMAGE_TAG"

          IMAGE=${{vars.ACCOUNT_ID}}.dkr.ecr.${{env.AWS_REGION}}.amazonaws.com/${{env.ECR_REPOSITORY}}:${IMAGE_TAG}
          echo "Deploying image:"
          echo $IMAGE

          COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{secrets.EC2_INSTANCE_ID}}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy diabetes api ${IMAGE_TAG}" \

          --parameters commands="[
          \"export KUBECONFIG=/etc/rancher/k3s/k3s.yaml\",

          \"kubectl set image deployment/${K8S_DEPLOYMENT} \
          -n diabetes-prod \
          ${K8S_CONTAINER}=${IMAGE}\",

          \"kubectl annotate deployment ${K8S_DEPLOYMENT} \
          -n diabetes-prod \
          build=${IMAGE_TAG} \
          --overwrite\",

          \"kubectl rollout status deployment/${K8S_DEPLOYMENT} \
          -n diabetes-prod \
          --timeout=180s || \
          (kubectl rollout undo deployment/${K8S_DEPLOYMENT} \
          -n diabetes-prod && exit 1)\",


          \"kubectl wait \
          --for=condition=ready \
          pod \
          -l app=diabetes-api \
          -n diabetes-prod \
          --timeout=120s\",

          \"kubectl get pods \
          -n diabetes-prod \
          -o wide\",

          \"kubectl describe deployment/${K8S_DEPLOYMENT} \
          -n diabetes-prod\"

          ]" \
          --query "Command.CommandId" \
          --output text \
          --region ${{env.AWS_REGION}})


          echo "SSM COMMAND ID:"
          echo $COMMAND_ID


          echo "Waiting for EC2 deployment..."

          aws ssm wait command-executed \
          --command-id $COMMAND_ID \
          --instance-id "${{secrets.EC2_INSTANCE_ID}}" \
          --region ${{env.AWS_REGION}}


          STATUS=$(aws ssm get-command-invocation \
          --command-id $COMMAND_ID \
          --instance-id "${{secrets.EC2_INSTANCE_ID}}" \
          --query "Status" \
          --output text \
          --region ${{env.AWS_REGION}})


          echo "Deployment STATUS:"
          echo $STATUS


          echo "----- OUTPUT -----"


          aws ssm get-command-invocation \
          --command-id $COMMAND_ID \
          --instance-id "${{secrets.EC2_INSTANCE_ID}}" \
          --query "StandardOutputContent" \
          --output text \
          --region ${{env.AWS_REGION}}


          echo "----- ERROR -----"


          aws ssm get-command-invocation \
          --command-id $COMMAND_ID \
          --instance-id "${{secrets.EC2_INSTANCE_ID}}" \
          --query "StandardErrorContent" \
          --output text \
          --region ${{env.AWS_REGION}}



          if [ "$STATUS" != "Success" ]
          then
              echo "Deployment failed"
              exit 1
          fi


          echo "Deployment completed successfully"