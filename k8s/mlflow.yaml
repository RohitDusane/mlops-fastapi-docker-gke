apiVersion: v1
kind: Namespace
metadata:
  name: mlflow
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data-pvc
  namespace: mlflow
spec:
  # k3s installs the "local-path" StorageClass by default — backed by a
  # directory on the node's own disk, no EBS CSI driver or S3 needed. This
  # is the same cost-vs-durability tradeoff as before: fine for one node,
  # gone if the node is replaced. Snapshot the EC2 instance's EBS volume
  # periodically if this data matters beyond a demo.
  storageClassName: local-path
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
spec:
  replicas: 1   # SQLite backend — do not scale beyond 1 replica
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: 146637284455.dkr.ecr.us-east-1.amazonaws.com/mlflow-server:v2
          # image: python:3.11-slim
          # command:
          #   - sh
          #   - -c
          #   - >
          #     pip install --no-cache-dir mlflow==2.17.0 &&
          #     mlflow server
          #     --backend-store-uri sqlite:////mlflow-data/mlflow.db
          #     --default-artifact-root /mlflow-data/artifacts
          #     --host 0.0.0.0 --port 5000
          #     --workers 1
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow-data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: mlflow-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP   # internal only — the app reaches it via cluster DNS, nothing external needed