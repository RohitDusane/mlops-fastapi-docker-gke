schema: '2.0'
stages:
  train_pipeline:
    cmd: python src/diabetes_risk_prediction/pipeline/training_pipeline.py
    deps:
    - path: configs/params.yaml
      hash: md5
      md5: 7f6e7cb6a5957f472ffe95c5b8c7a89c
      size: 1020
    - path: data/raw/raw_data.csv
      hash: md5
      md5: 8f90e44047182c5f32d10f0c4dd4890f
      size: 22738154
    - path: src
      hash: md5
      md5: 414e50a33341f928248c2037b9c04c7c.dir
      size: 143996
      nfiles: 59
    params:
      configs/params.yaml:
        evaluation:
          changed_threshold_score: 0.01
          max_precision_regression: 0.1
        mlflow:
          tracking_uri: ${MLFLOW_TRACKING_URI}
          experiment_name: diabetes-risk-screening-v3
          registered_model_name: diabetes-risk-model-v3
          model_alias: champion
        model_training:
          n_trials: 15
          cv_folds: 5
          cv_metric: average_precision
          candidate_algorithms:
          - random_forest
          - lightgbm
          - logistic_regression
          enable_pruning: true
          calibrate_probabilities: false
        quality_gate:
          min_roc_auc: 0.8
          min_recall: 0.7
          min_f1: 0.4
          overfitting_threshold: 0.1
          target_metric: recall
        threshold:
          target_recall_floor: 0.8
    outs:
    - path: artifacts/model_evaluation/confusion_matrix.json
      hash: md5
      md5: ea4c08602ecf19d604502f0ec4ca371f
      size: 111
    - path: artifacts/model_evaluation/metrics.json
      hash: md5
      md5: 96c007474d10787b273f86f60134c8a1
      size: 243
