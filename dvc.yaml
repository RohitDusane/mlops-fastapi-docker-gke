stages:
  train_pipeline:
    cmd: python src/diabetes_risk_prediction/pipeline/training_pipeline.py
    deps:
      - data/raw/raw_data.csv
      - src
      - configs/params.yaml
    params:
      - configs/params.yaml:
          - model_training
          - threshold
          - quality_gate
          - evaluation
          - mlflow
    metrics:
      - artifacts/model_evaluation/metrics.json:
          cache: false
    plots:
      - artifacts/model_evaluation/confusion_matrix.json:
          cache: false
          template: confusion
          x: predicted
          y: actual