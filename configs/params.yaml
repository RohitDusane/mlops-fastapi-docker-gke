artifacts:
  trainer_dir: artifacts/model_trainer
  evaluation_dir: artifacts/model_evaluation
  model_pusher_dir: artifacts/model_pusher

model_training:
  candidate_algorithms:
    - random_forest
    - lightgbm
    - logistic_regression
  n_trials: 15
  cv_folds: 5
  cv_metric: average_precision # PR-AUC — more informative than ROC-AUC under class imbalance
  enable_pruning: True
  optuna_n_jobs: 1

  # ---- Threshold tuning (decision threshold ≠ 0.5 for imbalanced screening) ----
  target_recall_floor: 0.80      # tune threshold to the highest cutoff that still meets this recall
  calibrate_probabilities: False  # set True to wrap the final model in CalibratedClassifierCV first
threshold: 0.49542214350854874
quality_gate:
  min_roc_auc: 0.80
  min_recall: 0.70               # false negatives are the costly error in a screening tool
  min_f1: 0.40
  overfitting_threshold: 0.10    # max allowed (train - test) gap on the primary metric

  # Primary metric used for the overfitting gap check and for
  # ModelEvaluation's champion-vs-challenger comparison downstream.
  target_metric: "recall"

evaluation:
  changed_threshold_score: 0.01  # new model must beat current Production by at least this much
  max_precision_regression: 0.10
