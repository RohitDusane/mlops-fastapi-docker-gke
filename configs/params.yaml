model_training:
  n_trials: 15
  cv_folds: 5
  cv_metric: average_precision
  candidate_algorithms:
    - random_forest
    - lightgbm
    - logistic_regression

threshold:
  target_recall_floor: 0.80

quality_gate:
  min_roc_auc: 0.80
  min_recall: 0.70
  min_f1: 0.40

evaluation:
  changed_threshold_score: 0.01
  max_precision_regression: 0.10

mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: diabetes-risk-screening
  registered_model_name: diabetes-risk-model

model_pusher:
  saved_model_dir: artifacts/model_pusher