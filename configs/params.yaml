artifacts:
  trainer_dir: artifacts/model_trainer
  evaluation_dir: artifacts/model_evaluation
  model_pusher_dir: artifacts/model_pusher

model_training:
  n_trials: 15
  cv_folds: 5
  cv_metric: average_precision
  candidate_algorithms:
    - random_forest
    - lightgbm
    - logistic_regression
  enable_pruning: true
  calibrate_probabilities: false

threshold:
  target_recall_floor: 0.80

quality_gate:
  min_roc_auc: 0.80
  min_recall: 0.70
  min_f1: 0.40
  overfitting_threshold: 0.10
  target_metric: recall

evaluation:
  changed_threshold_score: 0.01
  max_precision_regression: 0.10

mlflow:
  # tracking_uri: http://localhost:5000
  # tracking_uri: http://mlflow-service:5000
  tracking_uri: ${MLFLOW_TRACKING_URI}
  experiment_name: diabetes-risk-screening-v3
  registered_model_name: diabetes-risk-model-v3
  model_alias: champion

  # set MLFLOW_TRACKING_URI=http://localhost:5000
  # env:
  # - name: MLFLOW_TRACKING_URI
  #   value: http://mlflow-service:5000